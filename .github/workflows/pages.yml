name: Deploiement GitHub Pages

# Le projet est purement statique : aucune etape de construction n'est necessaire,
# on publie le depot tel quel.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Preparer l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
